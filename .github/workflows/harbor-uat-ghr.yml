
name: Harbor-UAT-GHR

on:
  push:
    branches:
      - 'release/**'

jobs:
  Build-Push-Harbor:
    environment: uat
    runs-on: [self-hosted, linux, x64, rean-dev-runner]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS is still required to download the environment file from S3.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Declare variables
        id: vars
        shell: bash
        run: |
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/\//-/g')
          SHA_SHORT=$(git rev-parse --short HEAD)

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha_short=$SHA_SHORT" >> "$GITHUB_OUTPUT"

      - name: Print branch details
        run: |
          echo "Branch: ${{ steps.vars.outputs.branch }}"
          echo "SHA: ${{ steps.vars.outputs.sha_short }}"

      - name: Copy env file from S3
        run: |
          aws s3 cp \
            "s3://${{ secrets.ENV_FILE_BUCKET_PATH }}/env.config" \
            ./.env

      - name: Extract ORIGIN from env file
        shell: bash
        run: |
          ORIGIN=$(grep '^BASE_URL=' ./.env | cut -d= -f2-)
          echo "ORIGIN=$ORIGIN" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: artifacts.reanfoundation.org
          username: ${{ secrets.GHR_HARBOR_USERNAME }}
          password: ${{ secrets.GHR_HARBOR_PASSWORD }}

      - name: Build and push image to Harbor
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          builder: ${{ steps.buildx.outputs.name }}
          build-args: |
            ORIGIN=${{ env.ORIGIN }}
          push: true
          tags: |
            artifacts.reanfoundation.org/rean-dev/user-analytics-dev-uat:sb.${{ steps.vars.outputs.branch }}_${{ steps.vars.outputs.sha_short }}

      - name: Image digest
        run: echo "${{ steps.docker_build.outputs.digest }}"
